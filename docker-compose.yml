services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
      POSTGRES_DB: survey
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey"]
      interval: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://survey:survey@db:5432/survey?sslmode=disable
      JWT_SECRET: local-dev-secret-change-me-at-least-32-chars
      # 3001 too: Next.js moves there when 3000 is busy
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
