services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
      POSTGRES_DB: survey
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey"]
      interval: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://survey:survey@db:5432/survey?sslmode=disable
      JWT_SECRET: local-dev-secret-change-me-at-least-32-chars
      ALLOWED_ORIGINS: http://localhost:3000
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
