# Render Blueprint: Postgres + Go API.
# Secrets are never stored here: the database URL comes from the database
# Render creates, and JWT_SECRET is generated by Render on first deploy.
databases:
  - name: survey-db
    plan: free
    region: singapore
    databaseName: survey
    user: survey

services:
  - type: web
    name: survey-builder-api
    runtime: docker
    plan: free
    region: singapore
    # With rootDir set, the Docker paths below are relative to rootDir.
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: survey-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The deployed frontend (Vercel). Comma-separated if there are several.
      - key: ALLOWED_ORIGINS
        value: https://dynamic-survey-builder-nu.vercel.app
      # Load the demo admin + demo survey on startup (idempotent).
      - key: SEED_DEMO
        value: "true"
